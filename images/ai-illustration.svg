<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="איור של חלון קוד המחובר לרשת נוירונים">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3ff"/>
      <stop offset="100%" stop-color="#e6f7f1"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6df6"/>
      <stop offset="100%" stop-color="#17b890"/>
    </linearGradient>
  </defs>

  <rect width="640" height="340" rx="24" fill="url(#bg)"/>

  <!-- חלון קוד -->
  <rect x="40" y="70" width="270" height="200" rx="14" fill="#ffffff" stroke="#d6deec" stroke-width="2"/>
  <rect x="40" y="70" width="270" height="34" rx="14" fill="#f2f5fb"/>
  <rect x="40" y="90" width="270" height="14" fill="#f2f5fb"/>
  <circle cx="64" cy="87" r="5" fill="#ff6b6b"/>
  <circle cx="82" cy="87" r="5" fill="#ffc93c"/>
  <circle cx="100" cy="87" r="5" fill="#17b890"/>

  <g fill="#c7d2e4">
    <rect x="64" y="126" width="120" height="9" rx="4.5"/>
    <rect x="64" y="148" width="190" height="9" rx="4.5"/>
    <rect x="86" y="170" width="150" height="9" rx="4.5"/>
    <rect x="86" y="192" width="110" height="9" rx="4.5"/>
    <rect x="64" y="214" width="170" height="9" rx="4.5"/>
  </g>
  <rect x="64" y="126" width="46" height="9" rx="4.5" fill="#2f6df6"/>
  <rect x="86" y="170" width="54" height="9" rx="4.5" fill="#17b890"/>
  <rect x="64" y="236" width="12" height="9" rx="4.5" fill="#2f6df6"/>

  <!-- חיבור בין הקוד לרשת -->
  <path d="M310 170 C 350 170, 350 120, 400 120" fill="none" stroke="url(#spark)" stroke-width="3" stroke-linecap="round"/>
  <path d="M310 170 C 350 170, 350 170, 400 170" fill="none" stroke="url(#spark)" stroke-width="3" stroke-linecap="round"/>
  <path d="M310 170 C 350 170, 350 220, 400 220" fill="none" stroke="url(#spark)" stroke-width="3" stroke-linecap="round"/>

  <!-- רשת נוירונים -->
  <g stroke="#9fb4d8" stroke-width="2">
    <line x1="400" y1="120" x2="500" y2="90"/>
    <line x1="400" y1="120" x2="500" y2="170"/>
    <line x1="400" y1="170" x2="500" y2="90"/>
    <line x1="400" y1="170" x2="500" y2="170"/>
    <line x1="400" y1="170" x2="500" y2="250"/>
    <line x1="400" y1="220" x2="500" y2="170"/>
    <line x1="400" y1="220" x2="500" y2="250"/>
    <line x1="500" y1="90" x2="575" y2="170"/>
    <line x1="500" y1="170" x2="575" y2="170"/>
    <line x1="500" y1="250" x2="575" y2="170"/>
  </g>

  <g fill="#ffffff" stroke="#2f6df6" stroke-width="3">
    <circle cx="400" cy="120" r="13"/>
    <circle cx="400" cy="170" r="13"/>
    <circle cx="400" cy="220" r="13"/>
  </g>
  <g fill="#ffffff" stroke="#17b890" stroke-width="3">
    <circle cx="500" cy="90" r="13"/>
    <circle cx="500" cy="170" r="13"/>
    <circle cx="500" cy="250" r="13"/>
  </g>
  <circle cx="575" cy="170" r="20" fill="url(#spark)"/>
  <path d="M575 158 l-8 16 h7 l-3 12 10 -17 h-7 z" fill="#ffffff"/>
</svg>
